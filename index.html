<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>미적분1 문제풀이</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">∫</span>
    <span class="brand-name">미적분1 문제풀이</span>
  </div>
  <div class="topbar-controls">
    <label class="select-wrap">
      <span class="select-label">개념</span>
      <select id="conceptSelect">
        <option value="">전체</option>
        <option value="limit">극한</option>
        <option value="derivative">미분</option>
        <option value="derivative-app">도함수의 활용</option>
        <option value="integral">부정적분</option>
        <option value="definite-integral">정적분</option>
        <option value="integral-app">적분의 활용</option>
      </select>
    </label>

    <div class="difficulty-group" id="difficultyGroup">
      <span class="select-label">난이도</span>
      <div class="difficulty-buttons">
        <button type="button" class="diff-btn" data-level="lower">하</button>
        <button type="button" class="diff-btn" data-level="mid">중</button>
        <button type="button" class="diff-btn" data-level="upper">상</button>
        <button type="button" class="diff-btn" data-level="top">최상</button>
      </div>
    </div>
  </div>
</header>

<main class="workspace">

  <!-- 문제 보기 섹션 -->
  <section class="panel problem-panel">
    <div class="panel-header">
      <h2>문제</h2>
      <span class="problem-index" id="problemIndex">문제 준비 중</span>
    </div>

    <div class="problem-body">
      <div class="problem-display" id="problemDisplay">
        <p class="placeholder-text">문제가 아직 등록되지 않았습니다.<br>문제 데이터가 추가되면 이 영역에 표시됩니다.</p>
      </div>

      <div class="answer-row">
        <input type="text" id="answerInput" class="answer-input" placeholder="정답을 입력하세요" disabled>
        <button type="button" id="checkAnswerBtn" class="btn btn-primary" disabled>정답 확인</button>
      </div>

      <div class="feedback" id="feedback"></div>
    </div>

    <div class="problem-footer">
      <button type="button" id="similarBtn" class="btn btn-ghost" disabled>비슷한 문제</button>
      <button type="button" id="nextBtn" class="btn btn-primary" disabled>다음 문제</button>
    </div>
  </section>

  <!-- 노트 섹션 (손글씨/펜) -->
  <section class="panel note-panel">
    <div class="panel-header">
      <h2>노트</h2>
      <button type="button" id="clearNoteBtn" class="btn btn-ghost btn-small">모두 지우기</button>
    </div>

    <div class="note-toolbar">
      <button type="button" id="undoBtn" class="icon-btn" title="되돌리기" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10h10a5 5 0 0 1 0 10h-1"/>
          <path d="M7 6l-4 4 4 4"/>
        </svg>
      </button>
      <button type="button" id="redoBtn" class="icon-btn" title="다시 실행" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10H11a5 5 0 0 0 0 10h1"/>
          <path d="M17 6l4 4-4 4"/>
        </svg>
      </button>

      <span class="tool-divider"></span>

      <div class="pen-tool-wrap">
        <button type="button" id="penBtn" class="icon-btn tool-btn active" title="펜">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
        </button>

        <div class="pen-popover" id="penPopover">
          <div class="tool-group" id="colorGroup">
            <button type="button" class="color-swatch active" data-color="#1d4ed8" style="background:#1d4ed8"></button>
            <button type="button" class="color-swatch" data-color="#0f172a" style="background:#0f172a"></button>
            <button type="button" class="color-swatch" data-color="#dc2626" style="background:#dc2626"></button>
            <button type="button" class="color-swatch" data-color="#16a34a" style="background:#16a34a"></button>
          </div>
          <div class="tool-group thickness-group">
            <label class="thickness-label">굵기</label>
            <input type="range" id="thicknessRange" min="1" max="10" value="3">
          </div>
        </div>
      </div>

      <button type="button" id="eraserBtn" class="icon-btn tool-btn" title="지우개">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13l-6.5 6.5a2 2 0 0 1-2.83 0L4.5 15.33a2 2 0 0 1 0-2.83L14 3a2 2 0 0 1 2.83 0L21 7.17a2 2 0 0 1 0 2.83L18 13Z"/>
          <path d="M15 8l-8 8"/>
          <path d="M9.5 20H21"/>
        </svg>
      </button>
    </div>

    <div class="canvas-wrap">
      <canvas id="noteCanvas"></canvas>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
